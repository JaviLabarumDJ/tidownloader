[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tidownloader"
version = "0.1.0"
description = "Tidal music downloader using your Tidal subscription"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tidownloader" }]
dependencies = [
    "tidalapi>=0.8.0",
    "requests>=2.31",
    "mutagen>=1.47",
    "pycryptodome>=3.19",
    "rich>=13.7",
    "m3u8>=5.0",
    "flask>=3.0",
]

[project.scripts]
tidownloader = "tidownloader.cli:main"
tidownloader-web = "tidownloader.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tidownloader.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]
